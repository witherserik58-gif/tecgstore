<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f1115" />
  <title>Бейнекарталар — TechStore</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./videocard.css" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <a class="back-btn" href="./index.html" aria-label="Артқа">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <div class="header-title">
      <h1>Бейнекарталар</h1>
      <span class="header-count" id="productCount">14 өнім</span>
    </div>
    <button class="cart-btn" type="button" id="cartBtn" aria-label="Себет">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span class="cart-badge" id="cartBadge" hidden>0</span>
    </button>
  </header>

  <main class="container">
    <!-- Search -->
    <div class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="search" id="searchInput" placeholder="Модель іздеу: RTX 4070, RX 7800..." autocomplete="off" />
    </div>

    <!-- Brand filter -->
    <div class="chips" id="brandChips" role="tablist" aria-label="Бренд">
      <button class="chip is-active" data-brand="all" role="tab" aria-selected="true">Барлығы</button>
      <button class="chip" data-brand="nvidia" role="tab" aria-selected="false">NVIDIA</button>
      <button class="chip" data-brand="amd" role="tab" aria-selected="false">AMD</button>
      <button class="chip" data-brand="intel" role="tab" aria-selected="false">Intel</button>
    </div>

    <!-- Sort & stock -->
    <div class="toolbar">
      <label class="sort">
        <span>Сұрыптау:</span>
        <select id="sortSelect">
          <option value="popular">Танымал</option>
          <option value="price-asc">Бағасы: арзаннан</option>
          <option value="price-desc">Бағасы: қымбаттан</option>
          <option value="vram">Жады көлемі</option>
        </select>
      </label>
      <label class="toggle">
        <input type="checkbox" id="stockOnly" />
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
        <span>Қоймада бар</span>
      </label>
    </div>

    <!-- Products -->
    <section class="products" id="products" aria-live="polite"></section>

    <!-- Empty state -->
    <div class="empty" id="emptyState" hidden>
      <p class="empty-title">Ештеңе табылмады</p>
      <p class="empty-sub">Сүзгіні өзгертіп немесе басқа модель іздеп көріңіз.</p>
      <button class="ghost-btn" type="button" id="resetBtn">Сүзгіні тазалау</button>
    </div>
  </main>

  <!-- Cart sheet -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <aside class="sheet" id="cartSheet" aria-hidden="true" aria-label="Себет">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <h2>Себет</h2>
      <button class="sheet-close" type="button" id="sheetClose" aria-label="Жабу">✕</button>
    </div>
    <div class="sheet-items" id="cartItems"></div>
    <div class="sheet-foot">
      <div class="sheet-total">
        <span>Жиыны</span>
        <strong id="cartTotal">0 ₸</strong>
      </div>
      <button class="buy-btn buy-btn--full" type="button" id="checkoutBtn">Тапсырыс беру</button>
    </div>
  </aside>

  <!-- Toast -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./videocard.js"></script>
</body>
</html>
